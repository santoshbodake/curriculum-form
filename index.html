<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autonomy 2026 — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #f0f4ff 0%, #fdf4ff 50%, #f3f4f6 100%);
    color: #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 16px;
    padding: 36px 32px;
    box-shadow: 0 16px 40px rgba(79, 70, 229, 0.12);
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(135deg, #4f46e5 0%, #9333ea 50%, #db2777 100%);
  }
  h1 {
    font-size: 20px;
    margin: 8px 0 4px;
    text-align: center;
  }
  p.sub {
    text-align: center;
    color: #64748b;
    font-size: 13px;
    margin: 0 0 28px;
  }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 8px;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    background: #f8fafc;
    color: #1e293b;
  }
  input:focus {
    background: #fff;
    border-color: #9333ea;
    outline: none;
    box-shadow: 0 0 0 4px rgba(147, 51, 234, 0.15);
  }
  button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    color: #fff;
    box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
    margin-top: 6px;
  }
  button:disabled { opacity: 0.65; cursor: not-allowed; }
  #loginMsg {
    margin-top: 14px;
    font-size: 13px;
    text-align: center;
    min-height: 18px;
  }
  #loginMsg.error { color: #dc2626; }
  #loginMsg.ok { color: #16a34a; }

  /* Dashboard shown after successful login */
  #dashboard { display: none; }
  #dashboard h1 { margin-bottom: 4px; }
  .welcome {
    text-align: center;
    color: #475569;
    font-size: 14px;
    margin-bottom: 28px;
  }
  .links { display: flex; flex-direction: column; gap: 14px; }
  .linkCard {
    display: block;
    text-decoration: none;
    padding: 18px 20px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    background: #f8fafc;
    color: #1e293b;
    transition: all 0.2s ease;
  }
  .linkCard:hover { border-color: #9333ea; background: #fff; box-shadow: 0 6px 16px rgba(124,58,237,0.12); }
  .linkCard strong { display: block; font-size: 15px; margin-bottom: 4px; }
  .linkCard span { font-size: 13px; color: #64748b; }
  .logoutBtn {
    margin-top: 24px;
    background: linear-gradient(135deg, #64748b 0%, #475569 100%);
    box-shadow: 0 4px 12px rgba(100, 116, 139, 0.2);
  }
</style>
</head>
<body>

<div class="card">

  <!-- Login form -->
  <div id="loginBox">
    <h1>Autonomy 2026</h1>
    <p class="sub">Sign in to access the Curriculum &amp; Scheme tools</p>

    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="loginBtn">Login</button>
      <div id="loginMsg"></div>
    </form>
  </div>

  <!-- Dashboard shown once logged in -->
  <div id="dashboard">
    <h1>Autonomy 2026</h1>
    <p class="welcome">Logged in as <strong id="welcomeUser"></strong></p>
    <div class="links">
      <a class="linkCard" href="data.html">
        <strong>Curriculum Data Entry &#8599;</strong>
        <span>Open the Curriculum Data Entry System</span>
      </a>
      <a class="linkCard" href="scheme.html">
        <strong>Learning &amp; Assessment Scheme &#8599;</strong>
        <span>Open the Scheme data entry tool</span>
      </a>
    </div>
    <button class="logoutBtn" onclick="logout()">Logout</button>
  </div>

</div>

<script>
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxxG_0OTue9ovCJU00FwMag1iPtyWCCrEX-fWgfNos18ZKs5QB9ciEkNqmTpHvSj8ohlg/exec";
const AUTH_KEY = 'autonomy2026_auth';

function getAuth() {
  try { return JSON.parse(sessionStorage.getItem(AUTH_KEY) || 'null'); }
  catch (e) { return null; }
}

function showDashboard(username) {
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('welcomeUser').textContent = username;
}

function logout() {
  sessionStorage.removeItem(AUTH_KEY);
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('loginBox').style.display = 'block';
  document.getElementById('loginForm').reset();
  setMsg('', '');
}

function setMsg(text, cls) {
  const el = document.getElementById('loginMsg');
  el.textContent = text;
  el.className = cls || '';
}

async function doLogin(event) {
  event.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');

  if (!username || !password) return false;

  btn.disabled = true;
  setMsg('Checking credentials...', '');

  try {
    const response = await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ formType: 'login', username: username, password: password })
    });
    const result = await response.json();

    if (result.success) {
      sessionStorage.setItem(AUTH_KEY, JSON.stringify({ username: result.username || username, token: result.token, ts: Date.now() }));
      setMsg('Login successful.', 'ok');
      showDashboard(result.username || username);
    } else {
      setMsg(result.message || 'Invalid username or password.', 'error');
    }
  } catch (error) {
    setMsg('Login failed: ' + error.message, 'error');
  } finally {
    btn.disabled = false;
  }
  return false;
}

// If already logged in this session, skip straight to the dashboard.
(function initFromSession() {
  const auth = getAuth();
  if (auth && auth.username) showDashboard(auth.username);
})();
</script>

</body>
</html>
